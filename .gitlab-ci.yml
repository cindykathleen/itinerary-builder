stages:
  - test
  - deploy

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

lint:
  stage: test
  script:
    - npm ci
    - npm run lint

unit:
  stage: test
  script:
    - npm ci
    - npm test

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - lint
    - unit
  script:
    - curl --fail -X POST "$RENDER_DEPLOY_HOOK"
